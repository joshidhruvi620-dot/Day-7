
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Panel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .student-card {
            padding: 12px;
            margin-top: 12px;
            background: #f8fafc;
            border-left: 5px solid #2563eb;
            border-radius: 5px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Result Panel</h1>

        <input type="text" id="studentName" placeholder="Enter Student Name">

        <input type="number" id="studentMarks"
               placeholder="Enter Marks (0-100)"
               min="0" max="100">

        <button onclick="addStudent()">Add Student</button>

        <h2>Student Results</h2>
        <div id="resultList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
